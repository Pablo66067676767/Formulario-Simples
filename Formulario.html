
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de cadastro</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 360px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            font-size: 24px;
            color: #06396b;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .campo {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #0066cc;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #004c99;
        }

        #msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            font-size: 14px;
        }

        .erro {
            background: #fde8e8;
            color: #c53030;
            display: block !important;
        }

        .sucesso {
            background: #e6fffa;
            color: #234e52;
            display: block !important;
        }
    </style>
</head>

<body>

    <h1>Formulário de cadastro</h1>

    <form method="post">

        <div class="campo">
            <label for="TxtNome">Nome:</label>
            <input type="text" id="TxtNome" placeholder="Digite seu nome" required>
        </div>

        <div class="campo">
            <label for="NumIdade">Idade:</label>
            <input type="number" id="NumIdade" placeholder="Digite sua idade" required>
        </div>

        <div class="campo">
            <label for="DtNascimento">Data de Nascimento:</label>
            <input type="date" id="DtNascimento" required>
        </div>

        <div class="campo">
            <label for="TxtEmail">E-mail:</label>
            <input type="email" id="TxtEmail" placeholder="Digite seu e-mail" required>
        </div>

        <div class="campo">
            <label for="TxtCep">CEP:</label>
            <input type="text" id="TxtCep" placeholder="Digite seu CEP" maxlength="9" required>
        </div>

        <div class="campo">
            <label for="TxtCidade">Cidade:</label>
            <input type="text" id="TxtCidade" placeholder="Digite sua cidade" required>
        </div>

        <div class="campo">
            <label for="TxtRua">Rua:</label>
            <input type="text" id="TxtRua" placeholder="Digite sua rua" required>
        </div>

        <div class="campo">
            <label for="TxtBairro">Bairro:</label>
            <input type="text" id="TxtBairro" placeholder="Digite seu bairro" required>
        </div>

        <div class="campo">
            <label for="NumNumero">Número:</label>
            <input type="number" id="NumNumero" placeholder="Digite o número" required>
        </div>

        <div class="campo">
            <label for="TxtEstado">Estado:</label>
            <input type="text" id="TxtEstado" placeholder="Digite seu estado" required>
        </div>

        <div id="msg"></div>

        <br>

        <button type="submit">Cadastrar</button>

    </form>

    <script>
       
const Cep = document.getElementById("TxtCep");

Cep.addEventListener("blur", function() {

    const viacep = this.value.replace(/\D/g, '');

    if (viacep.length !== 8) {
        alert("CEP inválido. Digite um CEP válido.");
        return;
    }

    fetch(`https://viacep.com.br/ws/${viacep}/json/`)
        .then(response => {
            if (!response.ok) {
                throw new Error("Erro na requisição");
            }

            return response.json();
        })

        .then(dados => {

            if (dados.erro) {
                alert("CEP não encontrado.");
                return;
            }

            document.getElementById("TxtRua").value = dados.logradouro;
            document.getElementById("TxtBairro").value = dados.bairro;
            document.getElementById("TxtCidade").value = dados.localidade;
            document.getElementById("TxtEstado").value = dados.uf;

        })

        .catch(error => {
            console.error("Erro ao buscar o CEP:", error);
            alert("Não foi possível consultar o CEP. Tente novamente.");
        });

});

    </script>

</body>
</html>
