
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de cadastro</title>
    <link rel="stylesheet" href="Formulario.css">
</head>

<body>

    <h1>Formulário de cadastro</h1>
    <form method="post">

        <div class="campo">
            <label for="TxtNome">Nome:</label>
            <input type="text" id="TxtNome" placeholder="Digite seu nome" required>
        </div>

        <div class="campo">
            <label for="NumIdade">Idade:</label>
            <input type="number" id="NumIdade" placeholder="Digite sua idade" required>
        </div>

        <div class="campo">
            <label for="DtNascimento">Data de Nascimento:</label>
            <input type="date" id="DtNascimento" required>
        </div>

        <div class="campo">
            <label for="TxtEmail">E-mail:</label>
            <input type="email" id="TxtEmail" placeholder="Digite seu e-mail" required>
        </div>

        <div class="campo">
            <label for="TxtCep">CEP:</label>
            <input type="text" id="TxtCep" placeholder="Digite seu CEP" maxlength="9" required>
        </div>

        <div class="campo">
            <label for="TxtCidade">Cidade:</label>
            <input type="text" id="TxtCidade" placeholder="Digite sua cidade" required>
        </div>

        <div class="campo">
            <label for="TxtRua">Rua:</label>
            <input type="text" id="TxtRua" placeholder="Digite sua rua" required>
        </div>

        <div class="campo">
            <label for="TxtBairro">Bairro:</label>
            <input type="text" id="TxtBairro" placeholder="Digite seu bairro" required>
        </div>

        <div class="campo">
            <label for="NumNumero">Número:</label>
            <input type="number" id="NumNumero" placeholder="Digite o número" required>
        </div>

        <div class="campo">
            <label for="TxtEstado">Estado:</label>
            <input type="text" id="TxtEstado" placeholder="Digite seu estado" required>
        </div>

        <div id="msg"></div>

        <br>

        <button type="submit">Cadastrar</button>

    </form>
     <script src="Formulario.js"></script>

</body>
</html>
